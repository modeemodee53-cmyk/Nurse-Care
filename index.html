<title>Nurse Care</title>

<style>
:root{--bg:#F2F7F5;--ink:#0C2F33;--mute:#4F6B6E;--sea:#0B5560;--mint:#CBE9E0;--sun:#F4B73F;--card:#fff;--line:#D3E3DE;--bad:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#0A1C1F;--ink:#E6F2EF;--mute:#9DB8B5;--sea:#6CC3CC;--mint:#17393D;--card:#112A2E;--line:#21474C;--bad:#FF8A80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:640px;margin:0 auto;padding:0 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font-weight:700;font-size:1.2rem;color:var(--sea);display:flex;gap:8px;align-items:center}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--sea);color:var(--sun);display:grid;place-items:center;font-style:normal}
button,input,select,textarea{font:inherit;color:inherit}
.sm{background:none;border:1.5px solid var(--sea);color:var(--sea);border-radius:99px;padding:4px 14px;cursor:pointer;margin-inline-start:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:1.5rem;margin:6px 0 4px}h2{font-size:1.1rem;margin:22px 0 10px}.mute{color:var(--mute);font-size:.92rem}
label{display:block;font-size:.9rem;margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
textarea{min-height:64px;resize:vertical}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{width:100%;margin-top:16px;background:var(--sea);color:#fff;border:0;border-radius:14px;padding:13px;font-weight:700;cursor:pointer}
@media(prefers-color-scheme:dark){.btn{color:#06262A}}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs button{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:none;cursor:pointer;font-weight:600}
.tabs .on{background:var(--sea);color:#fff;border-color:var(--sea)}
@media(prefers-color-scheme:dark){.tabs .on{color:#06262A}}
.radio{display:flex;gap:10px}.radio label{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;margin:0;font-weight:400}
.radio input{width:auto}
.row{display:flex;justify-content:space-between;gap:10px;align-items:start}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--mint);color:var(--sea);font-weight:600;white-space:nowrap}
.badge.accepted{background:var(--sun);color:#2A1F00}.badge.cancelled{background:var(--line);color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;border-radius:12px;padding:9px;border:1.5px solid var(--sea);background:none;color:var(--sea);cursor:pointer;font-weight:600}
.acts .p{background:var(--sea);color:#fff}@media(prefers-color-scheme:dark){.acts .p{color:#06262A}}
.err{color:var(--bad);font-size:.9rem;margin-top:10px;min-height:1.2em}
.note{background:var(--mint);border-radius:12px;padding:12px;font-size:.92rem}
.doc{width:100%;border-radius:12px;margin:6px 0 10px;border:1px solid var(--line)}
#lg{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}#lg[hidden]:not([hidden]){display:block}#lg[hidden]{display:none}.lgw{max-width:640px;margin:0 auto;padding:14px 0 40px}.lgw p{margin:0 0 6px}.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:14px}.chk input{width:auto;margin-top:5px}.chk a{color:var(--sea)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.kpi b{display:block;font-size:1.35rem;color:var(--sea)}.kpi span{font-size:.78rem;color:var(--mute)}
.hrow{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;margin-top:8px}.hbar{height:8px;background:var(--mint);border-radius:99px;overflow:hidden}.hbar i{display:block;height:100%;background:var(--sea)}
.days{display:flex;align-items:flex-end;gap:3px;height:70px}.days div{flex:1;height:100%;display:flex;align-items:flex-end;background:var(--mint);border-radius:3px}.days i{display:block;width:100%;background:var(--sea);border-radius:3px}
.w.wide{max-width:980px}.adm .card{box-shadow:0 2px 8px rgba(12,47,51,.07);border-radius:18px}
.atabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px;position:sticky;top:0;background:var(--bg);z-index:5}.atabs button{border:0;background:var(--card);color:var(--mute);padding:9px 15px;border-radius:12px;font-weight:600;white-space:nowrap;cursor:pointer;box-shadow:0 1px 3px rgba(12,47,51,.08)}.atabs .on{background:var(--sea);color:#fff}
@media(prefers-color-scheme:dark){.atabs .on,.fl .on{color:#06262A}}
.dot{background:var(--sun);color:#2A1F00;border-radius:99px;padding:0 7px;font-size:.75rem}
.hero{background:linear-gradient(135deg,var(--sea),#0b8d9a);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px}@media(prefers-color-scheme:dark){.hero{color:#06262A}}.hnum{display:flex;gap:26px;margin-top:10px;flex-wrap:wrap}.hnum b{font-size:1.9rem;display:block;line-height:1.1}.hnum small{opacity:.85}
.kpi i{font-style:normal;font-size:1.25rem;display:block}.kpis{margin:14px 0}
.donutw{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.donut{width:120px;height:120px;border-radius:50%;position:relative;flex:none}.donut::after{content:'';position:absolute;inset:24px;background:var(--card);border-radius:50%}.lg span{display:block;font-size:.88rem;margin:3px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.fl{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.fl button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 13px;cursor:pointer;font-size:.85rem}.fl .on{background:var(--sea);color:#fff;border-color:var(--sea)}
.badge.bad{background:#FDE3E1;color:#B3261E}.acts .bad{border-color:var(--bad);color:var(--bad)}
.lmap{height:280px;border-radius:14px;margin:10px 0;display:none}.lmap.show{display:block}.leaflet-container{font:inherit}.pinw{background:none;border:0}.pin{font-size:26px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
footer{color:var(--mute);font-size:.82rem;text-align:center;margin-top:24px}
</style>

<body>
<div class="w">
<header><div class="logo"><i>+</i>Nurse Care</div><div id="hdr"></div></header>
<main id="main"><div class="card"><p class="mute">جاري تحميل التطبيق...</p></div></main>
<footer id="foot"></footer>
</div>
<div id="lg" hidden></div>
<script>
window.onerror = function(msg, url, line) {
  const m = document.getElementById('main');
  if(m) m.innerHTML = `<div class="card" style="color:var(--bad)"><b>خطأ برمجى:</b> ${msg} (سطر ${line})</div>`;
};
window.addEventListener('unhandledrejection', event => {
  const m = document.getElementById('main');
  if(m) m.innerHTML = `<div class="card" style="color:var(--bad)"><b>خطأ في الاتصال أو الوعد:</b> ${event.reason?.message || event.reason}</div>`;
});
</script>

const LEGAL={"en": {"privacy": {"title": "Privacy Policy", "s": [["Who we are", "Nurse Care is a platform that connects patients with independent licensed nurses for home care in Egypt. The operator is Mohamed Abou Bakr (\"we\"). Contact: {C}. By creating an account you agree to this policy."], ["Data we collect", "Account data: name, phone number, email address, password (kept by Firebase Authentication, not visible to us), national ID number and a photo of your national ID card. Nurses also provide a nursing license number and photos of their license and certificate. Request data: service, date, time, area, full address, notes, who provides medical supplies, price and visit confirmation status. These details can reveal information about your health, which is sensitive data. Technical data: your language choice and login session are stored on your device. Requests also include the medical supplies you ask the nurse to bring. You may also attach a photo of a prescription so the nurse knows which supplies to bring. Ratings and comments you give or receive, complaints you submit, and account status (such as blocks) are also stored. If you choose to share your location, we store its coordinates, and any map link you paste, with your request. After a nurse accepts a request, the nurse's live location is shared with the patient of that visit while the app is open, until the visit is completed or cancelled, and the last location is stored with the visit."], ["Why we use it", "To verify identities and nurse licenses; to create your account; to match requests with nurses and let the matched parties contact each other; to calculate and track our commission; to prevent fraud and keep users safe; and to meet legal obligations. We do not sell your data and we do not use it for advertising."], ["Who can see it", "Your national ID number and your ID, license and certificate photos are visible only to you and the Nurse Care administrator. Open requests show verified nurses only the service, date, time, area, price and requested supplies. Your name, phone number, address and notes are revealed only to the nurse who accepts your request, and the nurse's name and phone number are revealed to the patient after acceptance. We may disclose data if required by law or by a competent authority. A prescription photo, if you attach one, is revealed only to the nurse who accepts your request. Your shared location is revealed only to the nurse who accepts your request. A nurse's live location is visible only to the patient of that visit and to the administrator. To match nearby nurses, verified nurses also see an approximate area (about 1 km) of the location you selected; the exact location is revealed only to the nurse who accepts."], ["Service providers", "We use Google Firebase (authentication and database), GitHub Pages (hosting) and Google Fonts. Your data is processed on their infrastructure, which may be outside Egypt. By using the app you consent to this transfer. Maps are provided by OpenStreetMap: viewing a map or searching for a place sends the map area or search text to OpenStreetMap servers. If a nurse taps Navigate, Google Maps opens with the destination."], ["How long we keep it", "We keep your data while your account is active. If you delete your account, we close it and stop showing it in the app, but we keep your records for a limited period as needed for legal, safety, fraud-prevention, accounting and dispute-resolution purposes, after which they are deleted or anonymised. Contact {C} to ask about your data."], ["Security", "We use access rules so each user can only read the data they are entitled to, and the administrator verifies nurses before they can see requests. No system is completely secure, so keep your password private."], ["Your rights", "Under Egypt's Personal Data Protection Law (Law 151 of 2020) you may ask to access, correct or delete your data and withdraw your consent by contacting {C}. Withdrawing consent may prevent us from providing the service."], ["Children", "The service is for adults (18 and over). A minor patient must be represented by a parent or guardian who creates the account."], ["Changes", "We may update this policy. When it changes we will ask you to accept the new version."], ["Contact", "{C}"]]}, "terms": {"title": "Terms of Use", "s": [["About the service", "Nurse Care is a platform that connects patients with independent licensed nurses. Nurse Care does not provide medical care, does not employ nurses and does not control how services are delivered. Each nurse is an independent professional responsible for the care they provide."], ["Not for emergencies", "Nurse Care is not an emergency service and does not give medical advice. In an emergency call 123 for an ambulance."], ["Your account", "You must be 18 or older, give true and complete information including your real national ID number and photo, keep your password confidential and keep one account only. We may verify, refuse, suspend or close accounts that give false information or break these terms. Use a valid email address that you verify and a valid Egyptian mobile number. You may delete your account in the app."], ["Patients", "Describe your need accurately, including who provides the medical supplies. Make sure the visit location is safe and that a prescription or doctor's instructions are available when the service requires them. Confirm a visit only if it really took place. You can cancel a request until the nurse confirms the visit. If a nurse accepts your request but does not come, you can re-open the request two hours after the scheduled time slot ends. Nurses bring medical supplies only; medicines are bought by the patient from a licensed pharmacy."], ["Nurses", "You must hold a valid nursing license and give true documents. Perform only services within your license and training, follow doctors' orders, use sterile and safe practices and treat patients with respect and confidentiality. Use contact details and patient information only to carry out the requested visit. If you accept a request and do not perform the visit, the patient may re-open it two hours after the scheduled time slot ends; this is recorded on your account and repeated no-shows may lead to suspension. After accepting a request you must share your live location with the patient until the visit is completed. You may accept only requests within one hour of travel from the patient; your location when you accept is recorded with the request."], ["Prices and payment", "The app is free for patients. The price shown for each service is the amount the patient pays directly to the nurse, normally in cash after the visit, and may change. Medical supplies are agreed between patient and nurse when the nurse provides them."], ["Commission", "Nurse Care charges nurses a commission of {R}% of the listed price of each visit that both the nurse and the patient have confirmed. The nurse transfers it to Nurse Care as instructed in the app. Nurses who do not pay may be suspended. The rate may change with prior notice in the app."], ["Prohibited conduct", "Do not submit false documents or information, harass or endanger anyone, misuse other users' personal data, confirm visits that did not happen, or arrange visits outside the app with someone you met through it in order to avoid the commission. Ratings and complaints must be honest."], ["Blocking and complaints", "Nurse Care may warn, temporarily block or permanently block accounts that break these terms or put others at risk, and may cancel or re-open related requests. You can report a problem or complaint in the app and we will review it. Ratings are used to monitor quality and are visible to Nurse Care."], ["Liability", "To the maximum extent permitted by law, Nurse Care is not responsible for medical outcomes, the conduct of users or services provided by nurses. Nothing in these terms limits liability that cannot be limited under Egyptian law."], ["Privacy     destroyPick();destroyTrip();
    const m=$('main');
    m.innerHTML=!U?authHTML():isAdm()?adminHTML():!P?stuck():P.deleted?delHTML():blockedNow(P)?blkHTML():!U.emailVerified?verifyHTML():P.termsV!==TERMS_V?gateHTML():P.role==='patient'?patientHTML():nurseHTML();
    if($('pmap'))initPick();
    if(P&&P.role==='nurse'&&P.verified&&!isAdm())locNow();
    list();
  }catch(e){
    console.error("Render error:", e);
    const m=$('main');
    if(m)m.innerHTML=`<div class="card err">حدث خطأ أثناء عرض الصفحة: ${esc(e.message)}</div>`;
  }
}
const fail=e=>{const c=e&&e.code||'';return c.includes('email-already')?t('e_email'):c.includes('invalid-cred')||c.includes('wrong-password')||c.includes('user-not-found')?t('e_cred'):c.includes('weak')?t('e_weak'):c.includes('network')?t('e_net'):t('e_gen')};
const okNid=x=>/^[23]\d{13}$/.test(x)&&+x.slice(3,5)>=1&&+x.slice(3,5)<=12&&+x.slice(5,7)>=1&&+x.slice(5,7)<=31;
const show=m=>{const e=$('er');if(e)e.textContent=m};
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(b.tagName==='A')ev.preventDefault();
  try{
    if(a==='lang'){L=L==='ar'?'en':'ar';try{localStorage.setItem('nc-l',L)}catch(e){}render()}
    else if(a==='legal')openLegal(b.dataset.k);
    else if(a==='lclose')closeLegal();
    else if(a==='accept'){if(!$('agreeG').checked){show(t('e_agree'));return}await updateDoc(doc(db,'users',U.uid),{terms:true,termsV:TERMS_V,termsAt:Date.now()})}
    else if(a==='vchk'){await U.reload();if(U.emailVerified){await U.getIdToken(true);render()}else show(t('verStill'))}
    else if(a==='vres'){await sendEmailVerification(U);show(t('verSent'))}
    else if(a==='reopen'){const q=data.mine.find(x=>x.id===id);if(!q||!confirm(t('reopenQ')))return;await updateDoc(doc(db,'requests',id),{status:'open',nurseId:deleteField(),noShow:arrayUnion(q.nurseId),reopened:true})}
    else if(a==='forgot'){const em=($('e').value||'').trim();if(!em){show(t('e_fp'));return}await sendPasswordResetEmail(auth,em);$('er').innerHTML=`<span style="color:var(--sea)">${t('fpSent')}</span>`}
    else if(a==='atab'){atab=b.dataset.k;list()}
    else if(a==='ufl'){afl=b.dataset.k;list()}
    else if(a==='rfl'){rfl=b.dataset.k;list()}
    else if(a==='cfl'){cfl=b.dataset.k;list()}
    else if(a==='bpanel'){const k='b'+id;shown.has(k)?shown.delete(k):shown.add(k);list()}
    else if(a==='blk'){const d=+$('bd'+id).value;await updateDoc(doc(db,'users',id),{blocked:true,blockedUntil:d?Date.now()+d*864e5:0,blockReason:($('br'+id).value||'').trim()});shown.delete('b'+id)}
    else if(a==='unb')await updateDoc(doc(db,'users',id),{blocked:false});
    else if(a==='undel')await updateDoc(doc(db,'users',id),{deleted:false});
    else if(a==='afin')await updateDoc(doc(db,'requests',id),{status:'done',patientDone:true});
    else if(a==='acx')await updateDoc(doc(db,'requests',id),{status:'cancelled'});
    else if(a==='areo'){const q=(data.reqs||[]).find(x=>x.id===id);if(!q)return;await updateDoc(doc(db,'requests',id),{status:'open',nurseId:deleteField(),noShow:arrayUnion(q.nurseId),reopened:true})}
    else if(a==='crep'||a==='cres')await updateDoc(doc(db,'complaints',id),{status:a==='cres'?'resolved':'progress',adminReply:($('cp'+id).value||'').trim(),updated:Date.now()});
    else if(a==='gou'){if(!id)return;const u=uById(id);atab='us';afl='all';asearch=u.phone||u.name||id;list()}
    else if(a==='rate'){const q=(data.mine||[]).find(x=>x.id===id);if(!q)return;const pr=P.role==='patient';await setDoc(doc(db,'ratings',id+(pr?'_p':'_n')),{requestId:id,fromId:U.uid,toId:pr?q.nurseId:q.patientId,fromRole:P.role,stars:+$('rs'+id).value,comment:($('rc'+id).value||'').trim(),created:Date.now()})}
    else if(a==='delacc'){if((data.mine||[]).some(x=>x.status==='open'||x.status==='accepted')){alert(t('delBusy'));return}if(P.role==='nurse'&&(data.mine||[]).some(x=>x.status==='done'&&!x.feePaid&&fee(x)>0)){alert(t('delDue'));return}if(!confirm(t('delQ')))return;await updateDoc(doc(db,'users',U.uid),{deleted:true,deletedAt:Date.now()});await signOut(auth)}
    else if(a==='loc'){const o=$('locs');if(!navigator.geolocation){o.textContent=t('locErr');return}navigator.geolocation.getCurrentPosition(g=>setPin(g.coords.latitude,g.coords.longitude,Math.round(g.coords.accuracy),true),()=>{o.textContent=t('locErr')},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
    else if(a==='psearch'){const q=($('ps').value||'').trim(),o=$('locs');if(!q)return;if(!pm){o.textContent=t('mapFail');return}o.textContent=t('searching');const g=await geocode(q);if(Array.isArray(g)){pm.setView(g,16);o.textContent=t('searchHint')}else o.textContent=t(g==='ERR'?'searchErr':'noPlace')}
    else if(a==='trkon')trkStart(id);
    else if(a==='trkoff')trkStop();
    else if(a==='locnow')locNow();
    else if(a==='out')await signOut(auth);
    else if(a==='mode'){mode=b.dataset.m;render()}
    else if(a==='docs'){if(shown.has(id))shown.delete(id);else{shown.add(id);if(!(id in dc))getDoc(doc(db,'nurseDocs',id)).then(s=>{dc[id]=s.exists()?s.data():null;list()}).catch(()=>{dc[id]=null;list()})}list()}
    else if(a==='ver')await updateDoc(doc(db,'users',id),{verified:b.dataset.v==='1'});
    else if(a==='paid')await Promise.all(dueOf(id).ids.map(i=>updateDoc(doc(db,'requests',i),{feePaid:true})));
    else if(a==='acc'){
      const okL=await new Promise(z=>{if(!navigator.geolocation){z(null);return}navigator.geolocation.getCurrentPosition(g=>z(g.coords),()=>z(null),{enableHighAccuracy:true,timeout:15000,maximumAge:60000})});
      if(!okL){alert(t('needLoc'));return}
      const q0=(data.open||[]).find(x=>x.id===id);
      if(q0&&q0.alat!=null&&etaMin(hav(okL.latitude,okL.longitude,q0.alat,q0.alng))>MAXMIN){alert(t('tooFar').replace(/\{n\}/g,MAXMIN));return}
      
      let travelMs = 2 * 3600000;
      if(q0 && q0.alat != null){
        const dist = hav(okL.latitude, okL.longitude, q0.alat, q0.alng);
        const mins = etaMin(dist);
        travelMs = (mins + 60) * 60000;
      }
      const newReopenAfter = Date.now() + travelMs;

      const bt=writeBatch(db);
      bt.update(doc(db,'requests',id),{
        status:'accepted',
        nurseId:U.uid,
        acceptedAt:Date.now(),
        acceptLat:+okL.latitude.toFixed(3),
        acceptLng:+okL.longitude.toFixed(3),
        reopenAfter: newReopenAfter
      });
      bt.set(doc(db,'requests',id,'contact','n'),{nurseId:U.uid,nurseName:P.name,nursePhone:P.phone});
      await bt.commit();
      autoT[id]=1;
      trkStart(id);
    }
    else if(a==='done'){if(P.role==='nurse')trkStop(true);const q0=data.mine.find(x=>x.id===id)||{};await updateDoc(doc(db,'requests',id),q0.patientDone?{nurseDone:true,status:'done'}:{nurseDone:true})}
    else if(a==='pconf'){const q0=data.mine.find(x=>x.id===id)||{};await updateDoc(doc(db,'requests',id),q0.nurseDone?{patientDone:true,status:'done'}:{patientDone:true})}
    else if(a==='force')await Promise.all(pendOf(id).map(i=>updateDoc(doc(db,'requests',i),{status:'done',patientDone:true})));
    else if(a==='cx')await updateDoc(doc(db,'requests',id),{status:'cancelled'});
  }catch(e){alert(t('e_gen'))}
});
document.addEventListener('input',e=>{if(e.target.id==='asr'){asearch=e.target.value;list()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLegal();if(e.key==='Enter'&&e.target.id==='ps'){e.preventDefault();const b=document.querySelector('[data-a="psearch"]');if(b)b.click()}});
document.addEventListener('change',e=>{if(e.target.id==='sp'){const w=$('slw');if(w)w.hidden=e.target.value!=='nurse'}
  if(e.target.name==='role'){const w=$('lw');if(w)w.hidden=e.target.value!=='nurse'}});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();const f=ev.target,btn=f.querySelector('.btn'),v=i=>($(i)?.value||'').trim();btn.disabled=true;show('');
  try{
    if(f.id==='fa'){
      if(mode==='login')await signInWithEmailAndPassword(auth,v('e'),v('pw'));
      else{
        const role=f.querySelector('[name=role]:checked').value,lic=v('l');
        const nid=v('nid').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
        if(!v('n')||!v('p')||(role==='nurse'&&!lic)){show(t('e_req'));return}
        if(!$('agree').checked){show(t('e_agree'));return}
        if(!okNid(nid)){show(t('e_nid'));return}
        const ph=v('p').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\s-]/g,'').replace(/^\+?20/,'0');
        if(!/^01[0125]\d{8}$/.test(ph)){show(t('e_phone'));return}
        const f0=$('idc').files[0];if(!f0){show(t('e_idimg'));return}
        let imgs;
        try{imgs={idCard:await shrink(f0)};if(role==='nurse'){const x=$('li').files[0],y=$('ci').files[0];if(!x||!y){show(t('e_img'));return}imgs.license=await shrink(x);imgs.cert=await shrink(y)}}catch(z){show(t('e_big'));return}
        const c=await createUserWithEmailAndPassword(auth,v('e'),v('pw'));
        sendEmailVerification(c.user).catch(()=>{});
        await setDoc(doc(db,'users',c.user.uid),{role,name:v('n'),phone:ph,email:v('e'),nid,terms:true,termsV:TERMS_V,termsAt:Date.now(),license:role==='nurse'?lic:'',verified:false,created:Date.now()});
        await setDoc(doc(db,'nurseDocs',c.user.uid),{...imgs,created:Date.now()});
      }
    }else if(f.id==='fr'){
      if(!v('d')||!v('a')||!v('ad')){show(t('e_req'));return}
      if(!pin){show(t('e_pin'));return}
      const sup=v('sp')||'patient',sl=v('sl'),rf=sup==='nurse'?$('rxf').files[0]:null;if(sup==='nurse'&&!sl&&!rf){show(t('e_sup'));return}
      let rx='';if(rf){try{rx=await shrink(rf)}catch(z){show(t('e_big'));return}}
      const ends={am:12,pm:17,ev:21},dp=v('d').split('-'),ra=new Date(+dp[0],+dp[1]-1,+dp[2],(ends[v('t')]||21)+2).getTime();
      const rr=doc(collection(db,'requests')),bt=writeBatch(db);
      bt.set(rr,{patientId:U.uid,service:v('s'),price:PRICES[v('s')]||0,supplies:sup,supList:sup==='nurse'?sl:'',hasRx:!!rx,date:v('d'),slot:v('t'),area:v('a'),reopenAfter:ra,alat:+pin.lat.toFixed(2),alng:+pin.lng.toFixed(2),status:'open',created:Date.now()});
      bt.set(doc(rr,'contact','p'),{patientName:P.name,patientPhone:P.phone,address:v('ad'),note:v('nt'),rx,lat:pin.lat,lng:pin.lng,acc:pin.acc});
      await bt.commit();
      f.reset();$('slw').hidden=true;clearPin();$('er').innerHTML=`<span style="color:var(--sea)">${t('reqOk')}</span>`;
    }else if(f.id==='fc'){
      const e3=$('er3');e3.textContent='';
      await addDoc(collection(db,'complaints'),{fromId:U.uid,fromName:P.name,fromRole:P.role,requestId:v('cr'),type:v('ct'),text:v('cx'),status:'open',created:Date.now()});
      f.reset();e3.textContent=t('repOk');
    }
  }catch(e){show(fail(e))}finally{btn.disabled=false}
});
