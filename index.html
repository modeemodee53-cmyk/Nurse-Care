:root{--bg:#F2F7F5;--ink:#0C2F33;--mute:#4F6B6E;--sea:#0B5560;--mint:#CBE9E0;--sun:#F4B73F;--card:#fff;--line:#D3E3DE;--bad:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#0A1C1F;--ink:#E6F2EF;--mute:#9DB8B5;--sea:#6CC3CC;--mint:#17393D;--card:#112A2E;--line:#21474C;--bad:#FF8A80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:640px;margin:0 auto;padding:0 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font-weight:700;font-size:1.2rem;color:var(--sea);display:flex;gap:8px;align-items:center}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--sea);color:var(--sun);display:grid;place-items:center;font-style:normal}
button,input,select,textarea{font:inherit;color:inherit}
.sm{background:none;border:1.5px solid var(--sea);color:var(--sea);border-radius:99px;padding:4px 14px;cursor:pointer;margin-inline-start:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:1.5rem;margin:6px 0 4px}h2{font-size:1.1rem;margin:22px 0 10px}.mute{color:var(--mute);font-size:.92rem}
label{display:block;font-size:.9rem;margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
textarea{min-height:64px;resize:vertical}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{width:100%;margin-top:16px;background:var(--sea);color:#fff;border:0;border-radius:14px;padding:13px;font-weight:700;cursor:pointer}
@media(prefers-color-scheme:dark){.btn{color:#06262A}}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs button{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:none;cursor:pointer;font-weight:600}
.tabs .on{background:var(--sea);color:#fff;border-color:var(--sea)}
@media(prefers-color-scheme:dark){.tabs .on{color:#06262A}}
.radio{display:flex;gap:10px}.radio label{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;margin:0;font-weight:400}
.radio input{width:auto}
.row{display:flex;justify-content:space-between;gap:10px;align-items:start}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--mint);color:var(--sea);font-weight:600;white-space:nowrap}
.badge.accepted{background:var(--sun);color:#2A1F00}.badge.cancelled{background:var(--line);color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;border-radius:12px;padding:9px;border:1.5px solid var(--sea);background:none;color:var(--sea);cursor:pointer;font-weight:600}
.acts .p{background:var(--sea);color:#fff}@media(prefers-color-scheme:dark){.acts .p{color:#06262A}}
.err{color:var(--bad);font-size:.9rem;margin-top:10px;min-height:1.2em}
.note{background:var(--mint);border-radius:12px;padding:12px;font-size:.92rem}
  .doc{width:100%;border-radius:12px;margin:6px 0 10px;border:1px solid var(--line)}
#lg{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}#lg[hidden]{display:none}.lgw{max-width:640px;margin:0 auto;padding:14px 0 40px}.lgw p{margin:0 0 6px}.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin-top:14px}.chk input{width:auto;margin-top:5px}.chk a{color:var(--sea)}
footer{color:var(--mute);font-size:.82rem;text-align:center;margin-top:24px}
</style>
</head>

const LEGAL={"en": {"privacy": {"title": "Privacy Policy", "s": [["Who we are", "Nurse Care is a platform that connects patients with independent licensed nurses for home care in Egypt. The operator is Mohamed Abou Bakr (\"we\"). Contact: {C}. By creating an account you agree to this policy."], ["Data we collect", "Account data: name, phone number, email address, password (kept by Firebase Authentication, not visible to us), national ID number and a photo of your national ID card. Nurses also provide a nursing license number and photos of their license and certificate. Request data: service, date, time, area, full address, notes, who provides medical supplies, price and visit confirmation status. These details can reveal information about your health, which is sensitive data. Technical data: your language choice and login session are stored on your device. Requests also include the medical supplies you ask the nurse to bring. You may also attach a photo of a prescription so the nurse knows which supplies to bring."], ["Why we use it", "To verify identities and nurse licenses; to create your account; to match requests with nurses and let the matched parties contact each other; to calculate and track our commission; to prevent fraud and keep users safe; and to meet legal obligations. We do not sell your data and we do not use it for advertising."], ["Who can see it", "Your national ID number and your ID, license and certificate photos are visible only to you and the Nurse Care administrator. Open requests show verified nurses only the service, date, time, area, price and requested supplies. Your name, phone number, address and notes are revealed only to the nurse who accepts your request, and the nurse's name and phone number are revealed to the patient after acceptance. We may disclose data if required by law or by a competent authority. A prescription photo, if you attach one, is revealed only to the nurse who accepts your request."], ["Service providers", "We use Google Firebase (authentication and database), GitHub Pages (hosting) and Google Fonts. Your data is processed on their infrastructure, which may be outside Egypt. By using the app you consent to this transfer."], ["How long we keep it", "We keep your data while your account is active and as long as needed for the purposes above or required by law. You can ask us to delete your account and data."], ["Security", "We use access rules so each user can only read the data they are entitled to, and the administrator verifies nurses before they can see requests. No system is completely secure, so keep your password private."], ["Your rights", "Under Egypt's Personal Data Protection Law (Law 151 of 2020) you may ask to access, correct or delete your data and withdraw your consent by contacting {C}. Withdrawing consent may prevent us from providing the service."], ["Children", "The service is for adults (18 and over). A minor patient must be represented by a parent or guardian who creates the account."], ["Changes", "We may update this policy. When it changes we will ask you to accept the new version."], ["Contact", "{C}"]]}, "terms": {"title": "Terms of Use", "s": [["About the service", "Nurse Care is a platform that connects patients with independent licensed nurses. Nurse Care does not provide medical care, does not employ nurses and does not control how services are delivered. Each nurse is an independent professional responsible for the care they provide."], ["Not for emergencies", "Nurse Care is not an emergency service and does not give medical advice. In an emergency call 123 for an ambulance."], ["Your account", "You must be 18 or older, give true and complete information including your real national ID number and photo, keep your password confidential and keep one account only. We may verify, refuse, suspend or close accounts that give false information or break these terms. Use a valid email address that you verify and a valid Egyptian mobile number."], ["Patients", "Describe your need accurately, including who provides the medical supplies. Make sure the visit location is safe and that a prescription or doctor's instructions are available when the service requires them. Confirm a visit only if it really took place. You can cancel a request until the nurse confirms the visit. If a nurse accepts your request but does not come, you can re-open the request two hours after the scheduled time slot ends. Nurses bring medical supplies only; medicines are bought by the patient from a licensed pharmacy."], ["Nurses", "You must hold a valid nursing license and give true documents. Perform only services within your license and training, follow doctors' orders, use sterile and safe practices and treat patients with respect and confidentiality. Use contact details and patient information only to carry out the requested visit. If you accept a request and do not perform the visit, the patient may re-open it two hours after the scheduled time slot ends; this is recorded on your account and repeated no-shows may lead to suspension."], ["Prices and payment", "The app is free for patients. The price shown for each service is the amount the patient pays directly to the nurse, normally in cash after the visit, and may change. Medical supplies are agreed between patient and nurse when the nurse provides them."], ["Commission", "Nurse Care charges nurses a commission of {R}% of the listed price of each visit that both the nurse and the patient have confirmed. The nurse transfers it to Nurse Care as instructed in the app. Nurses who do not pay may be suspended. The rate may change with prior notice in the app."], ["Prohibited conduct", "Do not submit false documents or information, harass or endanger anyone, misuse other users' personal data, confirm visits that did not happen, or arrange visits outside the app with someone you met through it in order to avoid the commission."], ["Liability", "To the maximum extent permitted by law, Nurse Care is no رض طلبك ولم يحضر، يمكنك إعادة فتح الطلب بعد انتهاء الموعد المحدد بساعتين. يحضر الممرضون المستلزمات الطبية فقط، أما الأدوية فيشتريها المريض من صيدلية مرخّصة."], ["الممرضون", "يجب أن تحمل رخصة تمريض سارية وتقدّم مستندات صحيحة. لا تقدّم إلا الخدمات التي تدخل في نطاق رخصتك وتدريبك، والتزم بتعليمات الطبيب، واتبع الممارسات المعقّمة والآمنة، وعامل المرضى باحترام وسرية. لا تستخدم بيانات الاتصال ومعلومات المريض إلا لتنفيذ الزيارة المطلوبة. إذا قبلت طلباً ولم تنفّذ الزيارة، يجوز للمريض إعادة فتح الطلب بعد انتهاء الموعد المحدد بساعتين، ويُسجَّل ذلك عليك، وقد يؤدي تكرار التخلّف إلى إيقاف حسابك."], ["الأسعار والدفع", "التطبيق مجاني للمرضى. السعر المعروض لكل خدمة هو المبلغ الذي يدفعه المريض للممرض مباشرة، عادةً نقداً بعد الزيارة، وقد يتغير. أما المستلزمات الطبية فيتفق عليها المريض والممرض عندما يوفّرها الممرض."], ["العمولة", "تحصّل Nurse Care من الممرض عمولة قدرها {R}% من السعر المعروض لكل زيارة أكّدها الممرض والمريض معاً. ويحوّلها الممرض إلى Nurse Care وفق التعليمات داخل التطبيق. قد يتم إيقاف الممرضين الذين لا يسددون. وقد تتغير النسبة بإشعار مسبق داخل التطبيق."], ["السلوك المحظور", "لا تقدّم مستندات أو معلومات كاذبة، ولا تضايق أو تعرّض أحداً للخطر، ولا تسيء استخدام بيانات المستخدمين الآخرين، ولا تؤكد زيارات لم تتم، ولا تتفق على زيارات خارج التطبيق مع شخص تعرفت عليه من خلاله بغرض تجنّب العمولة."], ["المسؤولية", "إلى أقصى حد يسمح به القانون، لا تتحمل Nurse Care مسؤولية النتائج الطبية أو سلوك المستخدمين أو الخدمات التي يقدّمها الممرضون. ولا يقيّد أي بند هنا مسؤولية لا يجوز تقييدها بموجب القانون المصري."], ["الخصوصية", "يوضّح استخدامنا لبياناتك في سياسة الخصوصية."], ["التعديلات", "قد نحدّث هذه الشروط، وفي هذه الحالة سنطلب منك الموافقة على النسخة الجديدة لتواصل استخدام التطبيق."], ["القانون الواجب التطبيق", "تخضع هذه الشروط لقوانين جمهورية مصر العربية، وتختص المحاكم المصرية المختصة بالنظر في أي نزاع."], ["التواصل", "{C}"]]}}};

function list(){

const stuck=()=>perr?`<div class="note">${t('e_perm')} (${esc(perr)})</div>`:nodoc?`<div class="note">${t('e_nodoc')}</div>`:`<p class="mute">${t('loading')}</p>`;
const adminHTML=()=>`<h1>${t('adminH')}</h1><div id="ad"></div>`;

const pendOf=id=>(data.acc||[]).filter(r=>r.nurseId===id&&r.nurseDone).map(r=>r.id);

const dueOf=id=>{const a=(data.done||[]).filter(r=>r.nurseId===id&&!r.feePaid);return {n:a.length,sum:a.reduce((x,r)=>x+fee(r),0),ids:a.map(r=>r.id)}};
function nCard(n){const o=shown.has(n.id),nu=n.role==='nurse',d=nu?dueOf(n.id):null;return `<div class="card"><div class="row"><b>${esc(n.name)}</b><span class="badge ${nu&&!n.verified?'accepted':''}">${nu?(n.verified?t('activeH'):t('pendingH')):t('patient')}</span></div>
<div class="mute">${esc(n.phone)}${nu?` · ${t('licNo')} ${esc(n.license)}`:''} · ${t('nidL')} ${esc(n.nid||'-')}</div>${nu&&n.verified?`<div>${t('dueL')}: <b>${d.sum} ${t('egp')}</b> (${d.n} ${t('nV')})</div>`:''}${nu&&nsOf(n.id)?`<div>${t('noS')}: <b>${nsOf(n.id)}</b></div>`:''}${nu&&n.verified&&pendOf(n.id).length?`<div class="mute">${t('pendL')}: ${pendOf(n.id).length}</div>`:''}${o?docsHTML(n.id):''}
<div class="acts"><button data-a="docs" data-id="${n.id}">${o?t('hideDocs'):t('viewDocs')}</button>${nu?`<button class="p" data-a="ver" data-id="${n.id}" data-v="${n.verified?0:1}">${n.verified?t('deactivate'):t('activate')}</button>`:''}${d&&d.n?`<button data-a="paid" data-id="${n.id}">${t('settle')}</button>`:''}${nu&&pendOf(n.id).length?`<button data-a="force" data-id="${n.id}">${t('force')}</button>`:''}</div></div>`}
const shrink=f=>new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,1000/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);let q=.7,d=c.toDataURL('image/jpeg',q);while(d.length>250000&&q>.25){q-=.1;d=c.toDataURL('image/jpeg',q)}d.length>250000?rej():res(d)};im.onerror=rej;im.src=u});
function openLegal(k){const d=LEGAL[L][k];
  $('lg').innerHTML=`<div class="lgw" role="dialog" aria-modal="true"><button class="sm" data-a="lclose">${t('close')}</button><h1>${esc(d.title)}</h1><p class="mute">${t('upd')}: ${TERMS_V}</p>`+d.s.map((x,i)=>`<h2>${i+1}. ${esc(x[0])}</h2><p>${esc(x[1]).replace(/\{C\}/g,esc(CONTACT)).replace(/\{R\}/g,RATE*100)}</p>`).join('')+`<button class="btn" data-a="lclose">${t('close')}</button></div>`;

const fail=e=>{const c=e&&e.code||'';return c.includes('email-already')?t('e_email'):c.includes('invalid-cred')||c.includes('wrong-password')||c.includes('user-not-found')?t('e_cred'):c.includes('weak')?t('e_weak'):c.includes('network')?t('e_net'):t('e_gen')};
const okNid=x=>/^[23]\d{13}$/.test(x)&&+x.slice(3,5)>=1&&+x.slice(3,5)<=12&&+x.slice(5,7)>=1&&+x.slice(5,7)<=31;
const show=m=>{const e=$('er');if(e)e.textContent=m};

  ev.preventDefault();const f=ev.target,btn=f.querySelector('.btn'),v=i=>($(i)?.value||'').trim();btn.disabled=true;show('');
