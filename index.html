<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B5560">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Nurse Care</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F7F5;--ink:#0C2F33;--mute:#4F6B6E;--sea:#0B5560;--mint:#CBE9E0;--sun:#F4B73F;--card:#fff;--line:#D3E3DE;--bad:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#0A1C1F;--ink:#E6F2EF;--mute:#9DB8B5;--sea:#6CC3CC;--mint:#17393D;--card:#112A2E;--line:#21474C;--bad:#FF8A80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',system-ui,sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:640px;margin:0 auto;padding:0 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font-weight:700;font-size:1.2rem;color:var(--sea);display:flex;gap:8px;align-items:center}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--sea);color:var(--sun);display:grid;place-items:center;font-style:normal}
button,input,select,textarea{font:inherit;color:inherit}
.sm{background:none;border:1.5px solid var(--sea);color:var(--sea);border-radius:99px;padding:4px 14px;cursor:pointer;margin-inline-start:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:1.5rem;margin:6px 0 4px}h2{font-size:1.1rem;margin:22px 0 10px}.mute{color:var(--mute);font-size:.92rem}
label{display:block;font-size:.9rem;margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
textarea{min-height:64px;resize:vertical}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{width:100%;margin-top:16px;background:var(--sea);color:#fff;border:0;border-radius:14px;padding:13px;font-weight:700;cursor:pointer}
@media(prefers-color-scheme:dark){.btn{color:#06262A}}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:8px;margin-bottom:6px}.tabs button{flex:1;padding:10px;border-radius:12px;border:1.5px solid var(--line);background:none;cursor:pointer;font-weight:600}
.tabs .on{background:var(--sea);color:#fff;border-color:var(--sea)}
@media(prefers-color-scheme:dark){.tabs .on{color:#06262A}}
.radio{display:flex;gap:10px}.radio label{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:8px;align-items:center;margin:0;font-weight:400}
.radio input{width:auto}
.row{display:flex;justify-content:space-between;gap:10px;align-items:start}
.badge{font-size:.78rem;padding:2px 10px;border-radius:99px;background:var(--mint);color:var(--sea);font-weight:600;white-space:nowrap}
.badge.accepted{background:var(--sun);color:#2A1F00}.badge.cancelled{background:var(--line);color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;border-radius:12px;padding:9px;border:1.5px solid var(--sea);background:none;color:var(--sea);cursor:pointer;font-weight:600}
.acts .p{background:var(--sea);color:#fff}@media(prefers-color-scheme:dark){.acts .p{color:#06262A}}
.err{color:var(--bad);font-size:.9rem;margin-top:10px;min-height:1.2em}
.note{background:var(--mint);border-radius:12px;padding:12px;font-size:.92rem}
footer{color:var(--mute);font-size:.82rem;text-align:center;margin-top:24px}
</style>
</head>
<body>
<div class="w">
<header><div class="logo"><i>+</i>Nurse Care</div><div id="hdr"></div></header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,setDoc,addDoc,updateDoc,collection,query,where,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyB-dV-31K2W5aE6FoEugd6kAF83BO4v3vI",
  authDomain:"nurse-care-6bba3.firebaseapp.com",
  projectId:"nurse-care-6bba3",
  storageBucket:"nurse-care-6bba3.firebasestorage.app",
  messagingSenderId:"202337614367",
  appId:"1:202337614367:web:48e202d7fa555db101f32a"});
const auth=getAuth(app),db=getFirestore(app);

const T={en:{login:"Log in",signup:"Create account",email:"Email",pass:"Password (6+ characters)",name:"Full name",phone:"Phone number",iam:"I am a",patient:"Patient",nurse:"Nurse",lic:"Nursing license number",logout:"Log out",hi:"Hello",
req:"Request a home visit",svc:"Service",date:"Date",slot:"Time",area:"Area / district",addr:"Full address",nt:"Notes (optional)",send:"Send request",mine:"My requests",none:"Nothing here yet.",
open:"Open",accepted:"Accepted",done:"Completed",cancelled:"Cancelled",cancel:"Cancel request",accept:"Accept visit",complete:"Mark completed",
wait:"Your nurse account is waiting for verification. We will check your license and activate it.",openReq:"Open requests",visits:"My visits",loading:"Loading...",
free:"Nurse Care is free to use. Agree on any fee directly with the nurse.",emerg:"Not for emergencies. Call 123 for an ambulance.",
nurseOn:"Nurse on the way",patientL:"Patient",addrL:"Address",
e_email:"This email is already registered. Try logging in.",e_cred:"Wrong email or password.",e_weak:"Password must be at least 6 characters.",e_net:"No connection. Check your internet and try again.",e_gen:"Something went wrong. Try again.",e_req:"Please fill in all required fields.",
svcs:{inj:"Injection",wound:"Wound care",iv:"IV drip",eld:"Elderly care",post:"Post-surgery care",vit:"Vitals check"},slots:{am:"Morning (9-12)",pm:"Afternoon (12-5)",ev:"Evening (5-9)"},lang:"العربية"},
ar:{login:"تسجيل الدخول",signup:"إنشاء حساب",email:"الإيميل",pass:"كلمة السر (6 حروف أو أكتر)",name:"الاسم بالكامل",phone:"رقم الموبايل",iam:"أنا",patient:"مريض",nurse:"ممرض/ة",lic:"رقم رخصة التمريض",logout:"تسجيل الخروج",hi:"أهلاً",
req:"اطلب زيارة منزلية",svc:"الخدمة",date:"التاريخ",slot:"الوقت",area:"المنطقة / الحي",addr:"العنوان بالتفصيل",nt:"ملاحظات (اختياري)",send:"ابعت الطلب",mine:"طلباتي",none:"مفيش حاجة لسه.",
open:"مفتوح",accepted:"اتقبل",done:"خلص",cancelled:"اتلغى",cancel:"إلغاء الطلب",accept:"اقبل الزيارة",complete:"تمّت الزيارة",
wait:"حساب الممرض بتاعك مستني التحقق. هنراجع رخصتك ونفعّل الحساب.",openReq:"الطلبات المفتوحة",visits:"زياراتي",loading:"بيحمّل...",
free:"Nurse Care مجاني للاستخدام. اتفق على أي مقابل مع الممرض مباشرة.",emerg:"مش للطوارئ. اتصل بـ 123 للإسعاف.",
nurseOn:"الممرض في الطريق",patientL:"المريض",addrL:"العنوان",
e_email:"الإيميل ده مسجّل قبل كده. جرّب تسجيل الدخول.",e_cred:"الإيميل أو كلمة السر غلط.",e_weak:"كلمة السر لازم تكون 6 حروف على الأقل.",e_net:"مفيش اتصال. اتأكد من النت وجرّب تاني.",e_gen:"حصلت مشكلة. جرّب تاني.",e_req:"من فضلك املا كل الخانات المطلوبة.",
svcs:{inj:"حقن",wound:"عناية بالجروح",iv:"محلول",eld:"رعاية كبار السن",post:"رعاية ما بعد العمليات",vit:"قياس العلامات الحيوية"},slots:{am:"صباحاً (9-12)",pm:"بعد الضهر (12-5)",ev:"مساءً (5-9)"},lang:"English"}};
let L=(()=>{try{return localStorage.getItem('nc-l')}catch(e){}})()||((navigator.language||'').startsWith('ar')?'ar':'en');
const t=k=>T[L][k]??k,$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let U=null,P=null,mode='login',data={mine:[],open:[]},unU=null,unR=[];
const stopR=()=>{unR.forEach(f=>f());unR=[]};

onAuthStateChanged(auth,u=>{
  stopR();unU&&unU();unU=null;U=u;P=null;data={mine:[],open:[]};render();
  if(!u)return;
  let was;
  unU=onSnapshot(doc(db,'users',u.uid),s=>{
    if(!s.exists())return;
    const first=!P,v=s.data().verified;P=s.data();
    if(first||was!==v){was=v;listen();render()}
  },()=>{});
});
function listen(){
  stopR();const r=collection(db,'requests'),map=s=>s.docs.map(d=>({id:d.id,...d.data()})),er=()=>{};
  if(P.role==='patient')unR.push(onSnapshot(query(r,where('patientId','==',U.uid)),s=>{data.mine=map(s);list()},er));
  else{
    unR.push(onSnapshot(query(r,where('nurseId','==',U.uid)),s=>{data.mine=map(s);list()},er));
    if(P.verified)unR.push(onSnapshot(query(r,where('status','==','open')),s=>{data.open=map(s);list()},er));
  }
}
const opts=o=>Object.entries(o).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join('');
function authHTML(){const s=mode==='signup';return `
<div class="card"><div class="tabs"><button data-a="mode" data-m="login" class="${s?'':'on'}">${t('login')}</button><button data-a="mode" data-m="signup" class="${s?'on':''}">${t('signup')}</button></div>
<form id="fa">
${s?`<label>${t('iam')}</label><div class="radio"><label><input type="radio" name="role" value="patient" checked>${t('patient')}</label><label><input type="radio" name="role" value="nurse">${t('nurse')}</label></div>
<label for="n">${t('name')}</label><input id="n" required><label for="p">${t('phone')}</label><input id="p" type="tel" inputmode="tel" required>
<div id="lw" hidden><label for="l">${t('lic')}</label><input id="l"></div>`:''}
<label for="e">${t('email')}</label><input id="e" type="email" autocomplete="email" required>
<label for="pw">${t('pass')}</label><input id="pw" type="password" minlength="6" autocomplete="${s?'new-password':'current-password'}" required>
<button class="btn" id="sb">${s?t('signup'):t('login')}</button><div class="err" id="er" role="alert"></div></form></div>
<div class="note">${t('free')}</div>`}
function patientHTML(){const d=new Date().toISOString().slice(0,10);return `
<h1>${t('hi')} ${esc(P.name)}</h1><div class="note">${t('free')}</div>
<h2>${t('req')}</h2><form class="card" id="fr">
<label for="s">${t('svc')}</label><select id="s">${opts(T[L].svcs)}</select>
<label for="d">${t('date')}</label><input id="d" type="date" min="${d}" required>
<label for="t">${t('slot')}</label><select id="t">${opts(T[L].slots)}</select>
<label for="a">${t('area')}</label><input id="a" required>
<label for="ad">${t('addr')}</label><input id="ad" required>
<label for="nt">${t('nt')}</label><textarea id="nt"></textarea>
<button class="btn">${t('send')}</button><div class="err" id="er" role="alert"></div></form>
<h2>${t('mine')}</h2><div id="l1"></div>`}
function nurseHTML(){return `<h1>${t('hi')} ${esc(P.name)}</h1>`+(P.verified?`<h2>${t('openReq')}</h2><div id="l2"></div><h2>${t('visits')}</h2><div id="l1"></div>`:`<div class="note">${t('wait')}</div>`)}
function card(r,kind){
  const sv=T[L].svcs[r.service]||r.service,sl=T[L].slots[r.slot]||r.slot,full=kind!=='open';
  let x=`<div class="card"><div class="row"><b>${esc(sv)}</b><span class="badge ${r.status}">${t(r.status)}</span></div><div class="mute">${esc(r.date)} · ${esc(sl)} · ${esc(r.area)}</div>`;
  if(full&&P.role==='nurse')x+=`<div>${t('patientL')}: ${esc(r.patientName)} · <a href="tel:${esc(r.patientPhone)}">${esc(r.patientPhone)}</a></div><div>${t('addrL')}: ${esc(r.address)}</div>`;
  if(r.note&&full)x+=`<div class="mute">${esc(r.note)}</div>`;
  if(P.role==='patient'&&r.nurseName)x+=`<div>${t('nurseOn')}: ${esc(r.nurseName)} · <a href="tel:${esc(r.nursePhone)}">${esc(r.nursePhone)}</a></div>`;
  x+='<div class="acts">';
  if(kind==='open')x+=`<button class="p" data-a="acc" data-id="${r.id}">${t('accept')}</button>`;
  if(kind==='mine'&&P.role==='nurse'&&r.status==='accepted')x+=`<button class="p" data-a="done" data-id="${r.id}">${t('complete')}</button>`;
  if(P.role==='patient'&&(r.status==='open'||r.status==='accepted'))x+=`<button data-a="cx" data-id="${r.id}">${t('cancel')}</button>`;
  return x+'</div></div>'}
function list(){
  if(!P)return;const by=a=>[...a].sort((x,y)=>y.created-x.created);
  const l1=$('l1'),l2=$('l2');
  if(l1){const a=by(data.mine);l1.innerHTML=a.length?a.map(r=>card(r,'mine')).join(''):`<p class="mute">${t('none')}</p>`}
  if(l2){const a=by(data.open);l2.innerHTML=a.length?a.map(r=>card(r,'open')).join(''):`<p class="mute">${t('none')}</p>`}
}
function render(){
  document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
  $('hdr').innerHTML=`<button class="sm" data-a="lang">${t('lang')}</button>`+(U?`<button class="sm" data-a="out">${t('logout')}</button>`:'');
  $('foot').innerHTML=`${t('emerg')}`;
  const m=$('main');
  m.innerHTML=!U?authHTML():!P?`<p class="mute">${t('loading')}</p>`:P.role==='patient'?patientHTML():nurseHTML();
  list();
}
const fail=e=>{const c=e&&e.code||'';return c.includes('email-already')?t('e_email'):c.includes('invalid-cred')||c.includes('wrong-password')||c.includes('user-not-found')?t('e_cred'):c.includes('weak')?t('e_weak'):c.includes('network')?t('e_net'):t('e_gen')};
const show=m=>{const e=$('er');if(e)e.textContent=m};
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  try{
    if(a==='lang'){L=L==='ar'?'en':'ar';try{localStorage.setItem('nc-l',L)}catch(e){}render()}
    else if(a==='out')await signOut(auth);
    else if(a==='mode'){mode=b.dataset.m;render()}
    else if(a==='acc')await updateDoc(doc(db,'requests',id),{status:'accepted',nurseId:U.uid,nurseName:P.name,nursePhone:P.phone});
    else if(a==='done')await updateDoc(doc(db,'requests',id),{status:'done'});
    else if(a==='cx')await updateDoc(doc(db,'requests',id),{status:'cancelled'});
  }catch(e){alert(t('e_gen'))}
});
document.addEventListener('change',e=>{if(e.target.name==='role'){const w=$('lw');if(w)w.hidden=e.target.value!=='nurse'}});
document.addEventListener('submit',async ev=>{
  ev.preventDefault();const f=ev.target,btn=f.querySelector('.btn'),v=i=>($(i)?.value||'').trim();btn.disabled=true;show('');
  try{
    if(f.id==='fa'){
      if(mode==='login')await signInWithEmailAndPassword(auth,v('e'),v('pw'));
      else{
        const role=f.querySelector('[name=role]:checked').value,lic=v('l');
        if(!v('n')||!v('p')||(role==='nurse'&&!lic)){show(t('e_req'));return}
        const c=await createUserWithEmailAndPassword(auth,v('e'),v('pw'));
        await setDoc(doc(db,'users',c.user.uid),{role,name:v('n'),phone:v('p'),license:role==='nurse'?lic:'',verified:false,created:Date.now()});
      }
    }else if(f.id==='fr'){
      if(!v('d')||!v('a')||!v('ad')){show(t('e_req'));return}
      await addDoc(collection(db,'requests'),{patientId:U.uid,patientName:P.name,patientPhone:P.phone,service:v('s'),date:v('d'),slot:v('t'),area:v('a'),address:v('ad'),note:v('nt'),status:'open',created:Date.now()});
      f.reset();
    }
  }catch(e){show(fail(e))}finally{btn.disabled=false}
});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
